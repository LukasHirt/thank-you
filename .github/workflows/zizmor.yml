name: Zizmor

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  schedule:
    # Weekly: online audits (known-vulnerable actions, impostor commits) can
    # start failing without a code change.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zizmor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: Zizmor
    uses: owncloud/reusable-workflows/.github/workflows/zizmor.yml@04aafe2344ca6b71fbef67c94785266563553b4c # main
