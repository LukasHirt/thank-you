name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  license-check:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install REUSE tool
        run: pip install "reuse[charset-normalizer]==6.3.0"

      - name: Run REUSE lint
        run: reuse lint

  dependency-license-check:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Check dependency licenses
        run: |
          npx --yes license-checker@25.0.1 --production \
            --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;AGPL-1.0" \
            --excludePrivatePackages

  check:
    name: Format, lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Format, lint and type check
        run: vp check

      - name: Unit tests
        run: vp test run

      - name: Build
        run: vp run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version-file: .nvmrc
          cache: true

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: vp exec playwright test

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
